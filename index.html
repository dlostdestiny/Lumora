<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1626">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icons/icon-192.png">
  <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lumora">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Lumora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"></div>
  <script src="js/files.js"></script>
  <script>
    (function () {
      var list = LUM_FILES.logic.concat(LUM_FILES.ui);
      list.forEach(function (src, i) {
        var s = document.createElement('script');
        s.src = src;
        s.async = false;
        if (i === list.length - 1) s.onload = function () { LUM.main(); };
        document.body.appendChild(s);
      });
    })();
  </script>
  <script>
    // Offline-Modus: nur online (http/https), nicht bei file:// und nicht lokal beim Entwickeln.
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
</body>
</html>
